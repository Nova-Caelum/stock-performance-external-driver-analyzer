# Deploys the Worker (wrangler.jsonc) on every push to main, or by hand.
# Repository secrets: CLOUDFLARE_API_TOKEN (deploy Workers, edit Worker routes on caelos.app and novacaelum.com)
# and CLOUDFLARE_ACCOUNT_ID. The app's own secrets are Worker secrets on Cloudflare, never here.
# No tests run here: the specs call Yahoo, and CI must not depend on it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm typecheck
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Build
        run: corepack pnpm build

      - name: Deploy
        run: corepack pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
